<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Startklar</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="description" content="Persönlicher Arbeitsplatz: Notizen, Boards, Projekte, Studien, Aufgaben und Kalender – lokal auf deinem Gerät, ohne Verbindung nach außen.">
<meta name="theme-color" content="#17212E">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Startklar">
<script src="shim.js"></script>
<style>
:root{
  --paper:#EDF0F3; --surface:#FFFFFF; --side:#E4E8ED; --ink:#17212E; --muted:#5B6878; --line:#D3DAE2;
  --accent:#2F5BEA; --accent-soft:#E2E9FD; --grid:#C3CCD6; --hover:rgba(23,33,46,.06);
  --danger:#C53650; --danger-soft:#FBE3E8; --ok:#2E9E6B; --warn:#B7860F; --warn-soft:#FBF1D2;
  --n-yellow:#FFE68C; --n-mint:#BCE7CF; --n-sky:#C3DBFB; --n-rose:#F8C9D3; --n-lilac:#DCCDF6; --n-white:#FFFFFF;
  --note-ink:#17212E; --shadow:0 1px 2px rgba(23,33,46,.12),0 4px 12px rgba(23,33,46,.08);
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-head:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#151B23; --surface:#1C242F; --side:#18202A; --ink:#E6EBF1; --muted:#9AA7B6; --line:#2E3947;
    --accent:#7C9BFF; --accent-soft:#25325A; --grid:#2C3744; --hover:rgba(230,235,241,.07);
    --danger:#FF7A90; --danger-soft:#3A2129; --warn:#E8BE4F; --warn-soft:#3A3120;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#151B23; --surface:#1C242F; --side:#18202A; --ink:#E6EBF1; --muted:#9AA7B6; --line:#2E3947;
  --accent:#7C9BFF; --accent-soft:#25325A; --grid:#2C3744; --hover:rgba(230,235,241,.07);
  --danger:#FF7A90; --danger-soft:#3A2129; --warn:#E8BE4F; --warn-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.3); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden,[hidden]{display:none!important}
.cols2{margin-top:8px}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
/* Sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;font:700 20px/1 var(--f-head);letter-spacing:-.01em}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--n-yellow);position:relative;box-shadow:var(--shadow)}
.brand .mark::after{content:"";position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;border-radius:5px;background:var(--n-sky);box-shadow:var(--shadow)}
.search{margin:4px 12px 8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:calc(100% - 24px);font-size:14px}
.nav{padding:0 8px 6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.nv{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:7px;font-size:14.5px;text-align:left}
.nv:hover{background:var(--hover)}
.nv.active{background:var(--surface);box-shadow:var(--shadow)}
.nv .ni{width:20px;text-align:center}
.nv .badge{margin-left:auto;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.treehead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 2px;font-size:12.5px;color:var(--muted)}
.treehead button{font-size:13px;padding:2px 8px;border-radius:6px;color:var(--muted)}
.treehead button:hover{background:var(--hover);color:var(--ink)}
.tree{flex:1;overflow:auto;padding:4px 8px 12px}
.row{display:flex;align-items:center;gap:4px;border-radius:7px;padding:3px 4px;font-size:14.5px;cursor:pointer;position:relative;user-select:none}
.row:hover{background:var(--hover)}
.row.active{background:var(--surface);box-shadow:var(--shadow)}
.row .tg{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:10px;flex:none}
.row .tg:hover{background:var(--hover)}
.row .tg.empty{visibility:hidden}
.row .ic{width:20px;text-align:center;flex:none}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .dot{width:7px;height:7px;border-radius:50%;flex:none;margin-right:2px}
.row .acts{display:none;gap:2px}
.row:hover .acts,.row:focus-within .acts{display:flex}
.row .acts button{width:22px;height:22px;border-radius:5px;color:var(--muted);display:grid;place-items:center}
.row .acts button:hover{background:var(--hover);color:var(--ink)}
.hit{display:block;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.hit:hover{background:var(--hover)}
.hit small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kids{margin-left:14px}
.foot{padding:10px 12px 12px 16px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.foot .sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.foot.saving .sdot{background:#E3B53B}
.foot.error .sdot{background:var(--danger)}
.foot #savetxt{flex:1;min-width:0}
.foot .fm{width:28px;height:28px;border-radius:7px;font-size:16px;color:var(--muted)}
.foot .fm:hover{background:var(--hover);color:var(--ink)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:14px 24px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-height:20px}
.crumbs button{color:var(--muted)} .crumbs button:hover{color:var(--ink);text-decoration:underline}
.titlerow{display:flex;align-items:center;gap:10px;margin-top:2px}
.bigicon{font-size:28px;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
button.bigicon:hover{background:var(--hover)}
.ptitle{flex:1;min-width:0;border:0;background:transparent;font:700 clamp(22px,3vw,30px)/1.15 var(--f-head);letter-spacing:-.015em;padding:4px 0;outline:none;margin:0}
.ptitle::placeholder{color:var(--muted);opacity:.6}
.metarow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--surface);white-space:nowrap}
button.chip:hover{border-color:var(--muted)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--surface)}
.seg button{padding:3px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.push{margin-left:auto}
.menubtn{display:none;width:36px;height:36px;border-radius:8px;font-size:20px}
.menubtn:hover{background:var(--hover)}

.content{flex:1;min-height:0;display:grid}
.content.m-split{grid-template-columns:minmax(320px,1fr) minmax(0,1.35fr)}
.content.m-doc,.content.m-board,.content.m-view{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0;min-width:0;position:relative}
.docpane,.viewpane{overflow:auto;background:var(--surface)}
.viewpane{background:var(--paper)}
.m-split .docpane{border-right:1px solid var(--line)}

/* Doc */
.doc{max-width:720px;margin:0 auto;padding:22px 28px 40vh 12px}
.doc.drop{outline:2px dashed var(--accent);outline-offset:-8px;border-radius:12px}
.blk{display:flex;align-items:flex-start;gap:2px;position:relative;border-radius:5px}
.bh{width:22px;height:26px;flex:none;color:var(--muted);opacity:0;border-radius:4px;font-size:12px;letter-spacing:-2px;margin-top:2px}
.blk:hover .bh,.bh:focus-visible{opacity:.7}
.bh:hover{background:var(--hover);opacity:1}
.bt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:3px 2px;min-height:1.5em}
.bt:empty:focus::before,.t-h1 .bt:empty::before,.t-h2 .bt:empty::before,.t-h3 .bt:empty::before{content:attr(data-ph);color:var(--muted);opacity:.55;pointer-events:none}
.t-h1{margin-top:18px}.t-h1 .bt{font:700 26px/1.25 var(--f-head);letter-spacing:-.01em}
.t-h2{margin-top:14px}.t-h2 .bt{font:700 20px/1.3 var(--f-head)}
.t-h3{margin-top:8px}.t-h3 .bt{font:700 17px/1.35 var(--f-body)}
.bul{width:22px;flex:none;text-align:center;padding-top:3px}
.bul::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ink);vertical-align:middle}
.chk{width:22px;flex:none;display:grid;place-items:center;height:30px}
.chk input,.trow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0;cursor:pointer}
.t-todo.done .bt{color:var(--muted);text-decoration:line-through}
.due{flex:none;font-size:12.5px;border-radius:99px;padding:1px 9px;margin-top:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.due.none{opacity:0;border-style:dashed}
.blk:hover .due.none,.blk:focus-within .due.none{opacity:1}
.due.over{background:var(--danger-soft);border-color:transparent;color:var(--danger);font-weight:700}
.due.today{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:700}
.due.soon{color:var(--ink)}
.due.done{opacity:.6;text-decoration:line-through}
.t-quote .bt{border-left:3px solid var(--accent);padding-left:14px;background:var(--accent-soft);border-radius:0 6px 6px 0;padding-top:8px;padding-bottom:8px;margin:4px 0}
.t-divider hr{flex:1;border:0;border-top:1px solid var(--line);margin:14px 2px}
.docend{min-height:120px;cursor:text}
.card{flex:1;min-width:0;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0;background:var(--surface)}
.card:hover{border-color:var(--muted)}
.card .fic{width:40px;height:48px;border-radius:6px;display:grid;place-items:center;font:700 11px/1 var(--f-body);color:#fff;flex:none;letter-spacing:.02em}
.card .cmeta{flex:1;min-width:0}
.card .cname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .csub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cbtn{font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);white-space:nowrap}
.card .cbtn:hover{background:var(--hover)}
.card.img{flex-direction:column;align-items:stretch}
.card.img img{max-width:100%;max-height:360px;object-fit:contain;border-radius:6px;background:var(--paper);cursor:zoom-in}
.card.img .crow{display:flex;gap:10px;align-items:center}
.card.busy{opacity:.6}
.lic{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:18px;flex:none}

/* Board */
.boardpane{overflow:hidden}
.board{position:absolute;inset:0;overflow:hidden;background-color:var(--paper);
  background-image:radial-gradient(circle,var(--grid) 1.2px,transparent 1.4px);outline:none;touch-action:none;cursor:default}
.board.panning{cursor:grabbing}
.board.drop{box-shadow:inset 0 0 0 3px var(--accent)}
.board.connecting .item{cursor:crosshair}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:1;pointer-events:none;color:var(--muted)}
.edges .eline{stroke:var(--muted);stroke-width:2;fill:none}
.edges .ehit{stroke:transparent;stroke-width:14;fill:none;pointer-events:stroke;cursor:pointer}
.edges .sel .eline{stroke:var(--accent);stroke-width:3}
.item{position:absolute;z-index:2;border-radius:4px;cursor:grab}
.item.k-note{background:var(--c);color:var(--note-ink);box-shadow:var(--shadow);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px}
.item.k-text{padding:4px 6px;color:var(--ink)}
.item.k-text .itxt{font:700 20px/1.3 var(--f-head)}
.item.k-frame{z-index:0;border-radius:10px;background:color-mix(in srgb,var(--c) 32%,transparent);border:1.5px solid color-mix(in srgb,var(--c) 90%,var(--ink) 10%)}
.item.k-file,.item.k-link{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.item.k-file img{width:100%;border-radius:6px;display:block;pointer-events:none;user-select:none}
.item .irow{display:flex;gap:10px;align-items:center;min-width:0}
.item .irow .cmeta{min-width:0;flex:1}
.item .cname{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .csub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .fic{width:36px;height:44px;border-radius:6px;display:grid;place-items:center;font:700 10.5px/1 var(--f-body);color:#fff;flex:none}
.ftitle{position:absolute;left:14px;top:10px;right:14px;font:700 17px/1.3 var(--f-head);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.itxt{outline:none;white-space:pre-wrap;word-break:break-word;flex:1;font-size:15.5px;line-height:1.4;min-height:1.4em}
.itxt:empty::before{content:attr(data-ph);opacity:.45}
.item.editing{cursor:text}
.item.editing .itxt,.item.editing .ftitle{cursor:text;user-select:text}
.item.sel{outline:2px solid var(--accent);outline-offset:3px}
.item.src{outline:2px dashed var(--accent);outline-offset:3px}
.lnk{align-self:flex-start;font-size:12.5px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.65);color:var(--note-ink);border:1px solid rgba(23,33,46,.15);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk:hover{background:#fff}
.rz{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;border-radius:4px;background:var(--surface);border:2px solid var(--accent);cursor:nwse-resize;display:none}
.item.sel .rz{display:block}
.btools{position:absolute;left:12px;top:12px;display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);z-index:5;flex-wrap:wrap;max-width:calc(100% - 24px)}
.btools button{padding:5px 10px;border-radius:8px;font-size:13.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.btools button:hover{background:var(--hover)}
.btools button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btools .sep{width:1px;background:var(--line);margin:4px 2px}
.btools .zl{min-width:52px;justify-content:center;color:var(--muted)}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(23,33,46,.2);display:inline-block}
.seltools{position:absolute;z-index:6;display:flex;flex-wrap:wrap;max-width:calc(100% - 16px);gap:4px;align-items:center;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);white-space:nowrap}
.seltools .cs{width:22px;height:22px;border-radius:6px;border:1px solid rgba(23,33,46,.2)}
.seltools .cs[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.seltools .tb{padding:4px 9px;border-radius:7px;font-size:13px}
.seltools .tb:hover{background:var(--hover)}
.seltools .tb.danger{color:var(--danger)}
.seltools .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 14px;border-radius:99px;font-size:13.5px;z-index:6;white-space:nowrap}
.empty{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--muted);text-align:center;padding:24px}
.empty strong{display:block;color:var(--ink);font:700 18px/1.3 var(--f-head);margin-bottom:4px}

/* Views */
.view{max-width:1100px;margin:0 auto;padding:22px 24px 80px}
.view h2{font:700 19px/1.3 var(--f-head);margin:28px 0 10px}
.view h2:first-child{margin-top:0}
.muted{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left}
.tile:hover{border-color:var(--muted)}
.tile b{display:block;font:700 28px/1.1 var(--f-head)}
.tile span{font-size:13.5px;color:var(--muted)}
.tile.alert b{color:var(--danger)}
.cols2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--side);border-radius:12px;padding:8px;min-height:140px;border:2px solid transparent}
.kcol.over{border-color:var(--accent)}
.kcol h3{margin:2px 4px 8px;font-size:14px;display:flex;align-items:center;gap:8px}
.kcol h3 .dot{width:8px;height:8px;border-radius:50%}
.kcol h3 small{color:var(--muted);font-weight:400}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:9px;padding:9px 10px;margin-bottom:6px;box-shadow:var(--shadow);cursor:grab}
.kcard .kt{font-weight:700;font-size:14.5px}
.kcard .ks{font-size:12.5px;color:var(--muted);margin-top:2px}
.trow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px}
.trow:hover{background:var(--hover)}
.trow .tt{flex:1;min-width:0;cursor:pointer}
.trow .tt.done{text-decoration:line-through;color:var(--muted)}
.trow .tp{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.trow .due{margin-top:0}
.tgroup{margin-bottom:6px}
.tgroup h3{font-size:13.5px;margin:14px 10px 4px;color:var(--muted);display:flex;gap:8px}
.tgroup h3.over{color:var(--danger)}
.quick{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.quick input[type=text]{flex:1 1 240px;border:0;outline:none;background:transparent;padding:6px 8px;min-width:0}
.quick input[type=date],.quick select{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:5px 8px;font-size:14px;max-width:220px}
.btn{padding:6px 14px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px;white-space:nowrap}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:var(--danger);color:#fff}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:220px minmax(0,1fr)}
.tl-labels{border-right:1px solid var(--line)}
.tl-labels .lh{height:46px;border-bottom:1px solid var(--line)}
.tl-labels .lr{height:40px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden}
.tl-labels .lr:hover{background:var(--hover)}
.tl-labels .lr span:last-child{overflow:hidden;text-overflow:ellipsis}
.tl-track{overflow-x:auto;position:relative}
.tl-inner{position:relative}
.tl-head{height:46px;border-bottom:1px solid var(--line);position:relative}
.tl-head .mo{position:absolute;top:4px;font-weight:700;font-size:13px;padding-left:6px;border-left:1px solid var(--line);height:40px;white-space:nowrap}
.tl-head .wk{position:absolute;top:26px;font-size:11.5px;color:var(--muted);padding-left:3px;white-space:nowrap}
.tl-row{height:40px;border-bottom:1px solid var(--line);position:relative}
.tl-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.6}
.tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3}
.tl-today span{position:absolute;top:2px;left:4px;font-size:11px;color:var(--accent);font-weight:700;white-space:nowrap}
.tl-bar{position:absolute;top:8px;height:24px;border-radius:6px;background:var(--c);color:#fff;font-size:12.5px;font-weight:700;padding:0 8px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;z-index:2;touch-action:none}
.tl-bar .hd{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.tl-bar .hd.l{left:0}.tl-bar .hd.r{right:0}
.tl-ms{position:absolute;top:13px;width:14px;height:14px;transform:rotate(45deg);background:var(--c);z-index:2;cursor:pointer;border-radius:2px}
.tl-dot{position:absolute;top:15px;width:10px;height:10px;transform:rotate(45deg);border:2px solid var(--surface);z-index:2;background:var(--muted)}
.tl-dot.over{background:var(--danger)}.tl-dot.done{background:var(--ok)}
.flist .frow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px}
.flist .frow:hover{background:var(--hover)}
.flist .fic,.flist .lic{width:34px;height:40px;border-radius:6px;display:grid;place-items:center;font:700 10px/1 var(--f-body);color:#fff;flex:none}
.flist .lic{height:34px;color:inherit;font-size:16px}
.flist .cmeta{flex:1;min-width:0}
.flist .cname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .csub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flist .cbtn{font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.flist .cbtn:hover{background:var(--hover)}
.emptybox{padding:26px 16px;text-align:center;color:var(--muted)}

/* Menu, pop, modal, toast */
.menu{position:fixed;z-index:70;min-width:200px;max-width:300px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:5px;max-height:70vh;overflow:auto}
.menu button{display:flex;width:100%;gap:10px;align-items:center;padding:6px 10px;border-radius:6px;font-size:14px;text-align:left}
.menu button:hover,.menu button.on{background:var(--hover)}
.menu button.danger{color:var(--danger)}
.menu .mhead{font-size:12px;color:var(--muted);padding:6px 10px 2px}
.menu .msep{height:1px;background:var(--line);margin:4px 2px}
.menu.grid{display:grid;grid-template-columns:repeat(6,1fr);min-width:0;width:252px;gap:2px}
.menu.grid button{justify-content:center;font-size:20px;padding:6px 0}
.menu .mi{width:18px;text-align:center;color:var(--muted);flex:none}
.menu .pop{padding:6px;display:flex;flex-direction:column;gap:8px}
.menu .pop label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.menu .pop input{border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--paper)}
.menu .pop .pbtns{display:flex;gap:6px;justify-content:flex-end}
.menu .pop .qd{display:flex;flex-wrap:wrap;gap:4px}
.menu .pop .qd button{width:auto;font-size:13px;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,15,22,.45);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(900px,100%);max-height:calc(100% - 20px);display:flex;flex-direction:column;min-height:0}
.dlg.small{width:min(440px,100%)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header h3{margin:0;flex:1;min-width:0;font:700 17px/1.3 var(--f-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dlg .x{width:32px;height:32px;border-radius:8px;font-size:18px}
.dlg .x:hover{background:var(--hover)}
.dlg .body{padding:16px;overflow:auto;min-height:0}
.dlg .body.flush{padding:0}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg iframe{width:100%;height:72vh;border:0;display:block;background:#fff}
.dlg .body img{max-width:100%;display:block;margin:0 auto}
.dlg pre{white-space:pre-wrap;word-break:break-word;font-size:13.5px;margin:0}
.dlg .form{display:flex;flex-direction:column;gap:12px}
.dlg .form label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted)}
.dlg .form input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:15px}
.docprev{max-width:720px;margin:0 auto;line-height:1.55}
.docprev table{border-collapse:collapse}.docprev td,.docprev th{border:1px solid var(--line);padding:4px 8px}
.docprev img{max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14px;z-index:90;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);background:var(--paper);z-index:100}
.scrim{display:none}

/* Tabs */
.tabs{display:flex;gap:2px;margin:10px -4px -11px;overflow-x:auto;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:7px;padding:7px 12px 9px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;border-radius:7px 7px 0 0}
.tab:hover{color:var(--ink);background:var(--hover)}
.tab.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.tab.add{color:var(--muted);font-size:13px}
.tab .ti{font-size:15px}
/* Ideas */
.kcard.idea{cursor:pointer}
.kcard .kd{font-size:13px;color:var(--muted);margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.kcard .kf{display:flex;align-items:center;gap:8px;margin-top:6px}
.stars button{font-size:16px;line-height:1;color:var(--muted);padding:0 1px}
.stars button.on{color:#D9A21B}
.kcard .lnk{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.small{font-size:13px;padding:6px 4px}
/* Library */
.view.drop{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:12px}
.bar .sel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;font-size:14px}
.lib{display:flex;flex-direction:column;gap:8px}
.lcard{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lcard.busy{opacity:.6}
.lcard .fic{width:36px;height:44px;border-radius:6px;display:grid;place-items:center;font:700 10.5px/1 var(--f-body);color:#fff;flex:none}
.lcard .lic{width:36px;height:36px}
.lcard .cmeta{flex:1;min-width:0}
.lcard .cname{font-weight:700;font-size:15.5px;text-align:left;line-height:1.35}
.lcard .cname:hover{text-decoration:underline}
.lcard .csub{font-size:13px;color:var(--muted);margin-top:2px}
.lnotes{font-size:13.5px;margin-top:6px;color:var(--ink);opacity:.85;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;border-left:2px solid var(--line);padding-left:8px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagchip{font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
button.tagchip:hover{outline:1px solid var(--accent)}
.tagchip.on{background:var(--accent);color:#fff}
.lside{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.lbtns{display:flex;gap:4px}
.lbtns .cbtn{font-size:13px;padding:4px 10px;border-radius:7px;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.lbtns .cbtn:hover{background:var(--hover)}
.dlg .form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font:inherit;font-size:15px;min-height:130px;resize:vertical;color:var(--ink)}
.dlg .form select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--paper);font-size:15px}
.dlg .form .two{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px}
/* Mindmap */
.mn{position:absolute;z-index:2;width:max-content;max-width:240px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1.5px solid var(--bc);color:var(--ink);font-size:14.5px;line-height:1.35;cursor:pointer;box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;user-select:none;touch-action:none}
.mn.d0{background:var(--ink);color:var(--paper);border:0;font:700 18px/1.3 var(--f-head);padding:11px 20px;border-radius:14px;max-width:300px;text-align:center}
.mn.d1{background:color-mix(in srgb,var(--bc) 20%,var(--surface));font-weight:700}
.mn.sel{outline:2.5px solid var(--accent);outline-offset:3px}
.mn.target{outline:2.5px dashed var(--accent);outline-offset:3px}
.mn.drag{opacity:.55;pointer-events:none;z-index:6}
.mn.editing{cursor:text;user-select:text}
.mn .mt{outline:none;display:inline-block;min-width:1ch}
.mn .more{margin-left:8px;font-size:11.5px;font-weight:700;background:var(--bc);color:#fff;border-radius:99px;padding:0 6px;vertical-align:1px}
.mn.d0 .more{background:var(--paper);color:var(--ink)}
.mmhint{opacity:.85}
.mn .mtask{margin-left:8px;font-size:12px;font-weight:700;border-radius:4px;padding:0 4px;background:var(--hover);color:var(--muted)}
.mn .mtask.done{background:#2E9E6B;color:#fff}
.mn.d0 .mtask{background:rgba(255,255,255,.2);color:var(--paper)}
.dlg .form .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end}
.lf ::placeholder{opacity:.55}
.dlg .form textarea[readonly]{min-height:0;font-size:14px;background:var(--surface)}
.dlg .form .pbtns{display:flex;justify-content:flex-end;margin-top:4px}
@media (max-width:820px){.mmhint{display:none}.lcard{flex-wrap:wrap}.lside{flex-direction:row;width:100%;justify-content:space-between}}

/* v4: refs, people, glossary, wins, probation, plan, risks, stakeholder, decisions */
.menu .msub{margin-left:auto;font-size:12px;color:var(--muted);padding-left:8px;white-space:nowrap}
.refs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;flex:none;max-width:45%}
.ref{font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.ref:hover{outline:1px solid var(--accent)}
.backlinks{margin:24px 0 0 24px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.backlinks h4{margin:0 8px 0 0;font-size:13px;color:var(--muted);font-weight:700;width:100%}
.dlg .form .backlinks{margin:6px 0 0}
.dlg .form textarea.aiout{min-height:300px;font-size:14.5px;line-height:1.55;background:var(--surface)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.linkbtn{color:var(--accent);font-weight:700;font-size:14px}
.linkbtn:hover{text-decoration:underline}
.two2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 14px/1 var(--f-body);flex:none}
.av.sm{width:24px;height:24px;font-size:10.5px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pcard:hover{border-color:var(--muted)}
.ptop{display:flex;gap:10px;align-items:center;min-width:0}
.ptop .cmeta{min-width:0}.ptop .cname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ptop .csub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pfoot{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.warnt{color:var(--warn);font-weight:700}
.qcount{background:var(--accent-soft);color:var(--ink);border-radius:99px;padding:0 8px}
.psec{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.psech{display:flex;align-items:center;justify-content:space-between;gap:8px}
.psech h4{margin:0;font-size:14.5px}
.qrow{display:flex;gap:8px;align-items:center;padding:3px 0}
.qrow span{flex:1}.qrow.done span{text-decoration:line-through;color:var(--muted)}
.qrow input{width:16px;height:16px;accent-color:var(--accent)}
.x{width:24px;height:24px;border-radius:6px;color:var(--muted);font-size:16px;flex:none}
.x:hover{background:var(--hover);color:var(--danger)}
.dlg .form input.qadd{padding:6px 10px;font-size:14px}
.tform{display:flex;flex-direction:column;gap:6px;background:var(--paper);border-radius:10px;padding:10px}
.tform textarea{min-height:70px!important}
.tform .btn{align-self:flex-end}
.trow2{display:flex;gap:10px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px;white-space:pre-wrap}
.trow2 b{flex:none;width:92px;font-size:13px;color:var(--muted)}
.trow2 span{flex:1}
.azbar{display:flex;flex-wrap:wrap;gap:2px;margin:10px 0}
.azbar button{width:28px;height:28px;border-radius:6px;font-weight:700;font-size:13px;color:var(--muted)}
.azbar button:hover{background:var(--hover);color:var(--ink)}
.glist .gl{font:700 20px/1 var(--f-head);margin:18px 4px 8px;color:var(--muted);scroll-margin-top:12px}
.gterm{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.gterm:hover{border-color:var(--muted)}
.ghead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ghead b{font-size:15.5px}
.gdef{font-size:14.5px;margin-top:3px;white-space:pre-wrap}
.gmeta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.winq{margin-top:12px}
.wmonth{font-size:13.5px;margin:14px 10px 4px;color:var(--muted);text-transform:capitalize}
.wic{width:22px;text-align:center;flex:none}
.probation{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:12px}
.probation .ph{display:flex;align-items:center;gap:12px;font-weight:700;margin-bottom:6px}
.probation .ph .muted{font-weight:400;font-size:14px}
.probation .ph .fm{margin-left:auto;width:28px;height:28px;border-radius:7px;color:var(--muted)}
.probation .ph .fm:hover{background:var(--hover)}
.probation p{margin:4px 0 10px}
.ptrack{position:relative;height:8px;border-radius:99px;background:var(--hover);margin:18px 10px 34px}
.ptrack .pfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.pms{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(45deg);background:var(--surface);border:2.5px solid var(--muted);border-radius:3px}
.pms.done{background:#2E9E6B;border-color:#2E9E6B}
.pms.due{border-color:var(--danger);background:var(--danger-soft)}
.pml{position:absolute;top:16px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.phint{font-size:14px}
.tl-bar.probbar{background:var(--accent-soft);color:var(--ink);font-weight:700}
.tl-bar.derived{background:transparent;border:2px dashed var(--c);color:var(--ink)}
.tl-ms.small{width:10px;height:10px;top:15px}
.psum{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pbar{height:10px;border-radius:99px;background:var(--hover);overflow:hidden}
.pbfill{height:100%;background:#2E9E6B;border-radius:99px}
.pstats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:14px;color:var(--muted)}
.pstats b{color:var(--ink)}
.pstats .bad{color:var(--danger);font-weight:700}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.ptable{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
.ptable th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:700;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr:last-child td{border-bottom:0}
.ptable tr.late td.ttl input{color:var(--danger)}
.ptable tr.fin td.ttl input{color:var(--muted);text-decoration:line-through}
.ptable td.ttl{min-width:240px}
.ptable td.ttl .tw{display:flex;align-items:center;gap:6px}
.ptable td.ttl input{flex:1;border:0;background:transparent;padding:5px 4px;border-radius:6px;font-size:14.5px;min-width:0}
.ptable td.ttl input:focus{background:var(--paper);outline:1px solid var(--line)}
.ptable input[type=date]{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 4px;font-size:13px}
.ptable input[type=date]:hover,.ptable input[type=date]:focus{border-color:var(--line);background:var(--paper)}
.ptable .num,.tl-labels .num{color:var(--muted);font-size:12px;width:30px}
.sdot{width:14px;height:14px;border-radius:50%;display:block;margin:0 auto}
.ownerbtn{padding:4px 8px;border-radius:6px;font-size:13.5px;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.ownerbtn:hover{background:var(--hover)}
.psel{border:1px solid transparent;background:transparent;border-radius:6px;padding:3px;font-size:13px}
.psel:hover{border-color:var(--line)}
.msic{color:var(--ink);font-size:13px}
.warn{color:var(--warn);cursor:help}
.chkrow{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-size:14px!important;color:var(--ink)!important;padding:3px 0}
.chkrow input{width:16px;height:16px;accent-color:var(--accent);flex:none}
.chkrow small{margin-left:auto;white-space:nowrap}
.aiplan{display:flex;flex-direction:column;gap:2px;max-height:45vh;overflow:auto}
.kcard.late{box-shadow:inset 3px 0 0 var(--danger),var(--shadow)}
.mini{height:5px;border-radius:99px;background:var(--hover);margin-top:7px;overflow:hidden}
.mini div{height:100%;background:#2E9E6B}
.tl-we{position:absolute;top:46px;bottom:0;background:var(--hover);opacity:.6}
.gbar{background:color-mix(in srgb,var(--c) 35%,var(--surface));color:var(--ink);padding:0}
.gbar .gfill{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.85}
.gbar .gtx{position:relative;padding:0 8px;z-index:1;text-shadow:0 0 3px var(--surface)}
.gbar.late{outline:2px solid var(--danger);outline-offset:1px}
.gdeps{position:absolute;left:0;top:0;pointer-events:none;z-index:1;color:var(--muted)}
.gdeps path{fill:none;stroke:var(--muted);stroke-width:1.5}
.gdeps path.bad{stroke:var(--danger);stroke-dasharray:4 3}
.mslab{position:absolute;top:11px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--ink)}
.tl-labels .lr small{margin-left:4px;overflow:hidden;text-overflow:ellipsis}
.rgrid{display:grid;grid-template-columns:minmax(260px,380px) minmax(0,1fr);gap:20px;align-items:start}

function startTimer(min) {

  TIMER.dur = min * 60000; TIMER.end = Date.now() + TIMER.dur; TIMER.paused = false; TIMER.rem = 0;
  clearInterval(TIMER.iv); TIMER.iv = setInterval(tickTimer, 250); tickTimer();
}

const REPEAT = { daily: 'Täglich', weekdays: 'An Werktagen', weekly: 'Wöchentlich', biweekly: 'Alle 2 Wochen', monthly: 'Monatlich' };
function advance(d, r) {
  if (r === 'daily') return addDays(d, 1);
  if (r === 'weekdays') { let x = addDays(d, 1); while ([0, 6].includes(parse(x).getDay())) x = addDays(x, 1); return x; }
  if (r === 'weekly') return addDays(d, 7);
  if (r === 'biweekly') return addDays(d, 14);
  if (r === 'monthly') { const dt = parse(d), day = dt.getDate(); dt.setDate(1); dt.setMonth(dt.getMonth() + 1); dt.setDate(Math.min(day, new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate())); return iso(dt); }
  return addDays(d, 1);
}
function completeRepeat(b) {
  let n = advance(b.due || today(), b.repeat);
  let guard = 0; while (n < today() && guard++ < 500) n = advance(n, b.repeat);
  b.checked = false; b.due = n; b.doneCount = (b.doneCount || 0) + 1; b.lastDone = today();
  toast('Erledigt ✓ – nächstes Mal: ' + dueLabel(n));
}

function backlinks(tg) {

/* ---------- File text (PDF, Word, Text) ---------- */
async function pdfText(blob) {
  await loadLib('pdfjs', LIB.pdfjs);
  await loadLib('pdfjsw', LIB.pdfjsw);
  const lib = window.pdfjsLib;
  const doc = await lib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), isEvalSupported: false, disableFontFace: true }).promise;
  const paras = [];
  for (let n = 1; n <= Math.min(doc.numPages, 150); n++) {
    const pg = await doc.getPage(n); const tc = await pg.getTextContent();
    let line = '', lines = [];
    tc.items.forEach(it => { line += it.str; if (it.hasEOL) { lines.push(line.trim()); line = ''; } });
    if (line.trim()) lines.push(line.trim());
    let buf = '';
    lines.forEach(l => {
      if (!l) { if (buf) { paras.push(buf); buf = ''; } return; }
      buf = buf ? (buf.endsWith('-') ? buf.slice(0, -1) + l : buf + ' ' + l) : l;
      if (/[.!?:]$/.test(l) && buf.length > 350) { paras.push(buf); buf = ''; }
    });
    if (buf) paras.push(buf);
  }
  return paras.join('\n\n');
}
async function fileText(m) {
  const k = fileKind(m), blob = await getFileBlob(m);
  if (k === 'docx') { await loadLib('mammoth', LIB.mammoth); return (await window.mammoth.extractRawText({ arrayBuffer: await blob.arrayBuffer() })).value; }
  if (k === 'pdf') return await pdfText(blob);
  return await blob.text();
}

function trashGroup(rootId) {
  const root = trash[rootId]; if (!root) return [];
  const ids = [rootId]; let grew = true;
  while (grew) { grew = false; Object.values(trash).forEach(p => { if (!ids.includes(p.id) && ids.includes(p.parent) && p.trashed === root.trashed) { ids.push(p.id); grew = true; } }); }
  return ids;
}
function purgeTrash() {
  const lim = Date.now() - 30 * 864e5;
  Object.values(trash).forEach(p => { if (p.trashed < lim) { delete trash[p.id]; Store.schedule(p.id); } });
  Object.values(pages).forEach(p => { if ((p.trashTabs || []).some(t => t.trashedAt < lim)) { p.trashTabs = p.trashTabs.filter(t => t.trashedAt >= lim); save(p.id); } });
}
function trashCount() { return Object.values(trash).filter(p => p.trashRoot).length + Object.values(pages).reduce((n, p) => n + (p.trashTabs || []).length, 0); }
function renderTrash(pane) {

  Object.values(pages).forEach(p => (p.trashTabs || []).forEach(tab => rows.push({ t: 'tab', p, tab, ts: tab.trashedAt })));
  rows.sort((a, b) => b.ts - a.ts);
  rows.forEach(r => {
    const row = el('div', 'frow');
    row.append(el('span', 'lic', r.t === 'page' ? (r.p.icon || '📄') : r.tab.icon));
    const m = el('div', 'cmeta');
    const left = 30 - Math.floor((Date.now() - r.ts) / 864e5);
    if (r.t === 'page') { const n = trashGroup(r.p.id).length - 1; m.append(el('div', 'cname', r.p.title || 'Ohne Titel'), el('div', 'csub', `Seite${n ? ` mit ${n} Unterseite${n > 1 ? 'n' : ''}` : ''} · gelöscht ${new Date(r.ts).toLocaleDateString('de-DE')} · noch ${left} Tage`)); }
    else m.append(el('div', 'cname', r.tab.name), el('div', 'csub', `Reiter aus „${r.p.title || 'Ohne Titel'}" · gelöscht ${new Date(r.ts).toLocaleDateString('de-DE')} · noch ${left} Tage`));
    row.append(m);
    const rs = el('button', 'cbtn', 'Wiederherstellen');
    rs.addEventListener('click', () => {
      if (r.t === 'page') {

/* ---------- Status report ---------- */
function statusReport(pg) {
  const tabs = pg.tabs || [];
  const plans = tabs.filter(t => t.kind === 'plan'), risks = tabs.filter(t => t.kind === 'risks'), decs = tabs.filter(t => t.kind === 'decisions');
  const T = today(), past = addDays(T, -14), fut = addDays(T, 14);
  const items = plans.flatMap(t => t.items);
  const W = items.filter(i => !i.milestone).reduce((s, i) => s + dur(i), 0), D = items.filter(i => !i.milestone).reduce((s, i) => s + dur(i) * (i.status === 'fertig' ? 100 : (+i.progress || 0)) / 100, 0);
  const pct = W ? Math.round(D / W * 100) : null;
  const todos = allTodos().filter(x => x.p.id === pg.id);
  const done = items.filter(i => i.status === 'fertig' && i.end >= past).map(i => (i.milestone ? '◆ ' : '') + i.title)
    .concat(todos.filter(x => x.b.checked && x.b.doneAt >= past).map(x => x.b.text));
  const next = items.filter(i => i.status !== 'fertig' && ((i.start && i.start <= fut && i.start >= T) || (i.end && i.end >= T && i.end <= fut))).map(i => `${i.milestone ? '◆ ' : ''}${i.title} (${i.milestone ? fmtShort(i.end) : 'bis ' + fmtShort(i.end)}${i.owner ? ', ' + ownerName(i.owner) : ''})`)
    .concat(todos.filter(x => !x.b.checked && x.b.due && x.b.due >= T && x.b.due <= fut).map(x => `${x.b.text} (fällig ${fmtShort(x.b.due)})`));
  const late = items.filter(isLate).map(i => `${i.title} (war fällig ${fmtShort(i.end)}${i.status === 'blockiert' ? ', blockiert' : ''})`)
    .concat(items.filter(i => i.status === 'blockiert' && !isLate(i)).map(i => `${i.title} (blockiert)`))
    .concat(todos.filter(x => !x.b.checked && x.b.due && x.b.due < T).map(x => `${x.b.text} (überfällig seit ${fmtShort(x.b.due)})`));
  const rk = risks.flatMap(t => t.items).filter(r => r.status !== 'erledigt').sort((a, b) => b.prob * b.impact - a.prob * a.impact);
  const topR = rk.filter(r => r.prob * r.impact >= 4).slice(0, 5).map(r => `${r.title}${r.measure ? ' – Maßnahme: ' + r.measure : ''}`);
  const openD = decs.flatMap(t => t.items).filter(d => d.status === 'offen').map(d => d.title);
  const lateMs = items.some(i => i.milestone && isLate(i));
  const qcs = tabs.filter(t => t.kind === 'qc' && t.q).map(t => qcStats(t.q));
  const critF = qcs.reduce((n, s) => n + s.crit, 0);
  const qual = [];
  qcs.forEach(s => qual.push(`Qualitätskontrolle: ${s.pct} % der Prüfpunkte erfüllt, ${s.mangel} Mängel, ${s.openF} offene Befunde${s.crit ? ' (' + s.crit + ' kritisch)' : ''}${s.overdue ? ', ' + s.overdue + ' Prüfpunkte überfällig' : ''}`));
  tabs.filter(t => t.kind === 'feasibility' && t.f).forEach(t => { const fs = feasScore(t.f); if (fs.pct != null) qual.push(`Machbarkeit: ${fs.pct} % – ${VERDICT[fs.verdict].l}${t.f.decision ? ' (Entscheidung: ' + ({ go: 'Go', cond: 'Go mit Auflagen', nogo: 'No-Go' })[t.f.decision] + ')' : ''}`); });
  tabs.filter(t => t.kind === 'study' && t.s).forEach(t => { const ch = studyChecks(t.s); const ok = ch.filter(c => c[1]).length; qual.push(`Studienprotokoll: ${Math.round(ok / ch.length * 100)} % vollständig${ok < ch.length ? ' – fehlt: ' + ch.filter(c => !c[1]).map(c => c[0]).slice(0, 4).join(', ') : ''}`); });
  let amp = lateMs || critF || items.some(i => i.status === 'blockiert') || rk.some(r => r.prob * r.impact >= 9) ? 'rot' : late.length || rk.some(r => r.prob * r.impact >= 6) ? 'gelb' : 'grün';
  const AMP = { grün: '🟢 Grün – im Plan', gelb: '🟡 Gelb – Aufmerksamkeit nötig', rot: '🔴 Rot – Eingreifen nötig' };
  const sec = (h, a, empty) => `${h}:\n${a.length ? a.map(x => '- ' + x).join('\n') : '- ' + empty}`;
  const build = () => [
    `Statusbericht: ${pg.title || 'Projekt'} – Stand ${fmtLong(T)}`,
    `Gesamtstatus: ${AMP[amp]}`,
    pct != null ? `Fortschritt: ${pct} % (${items.filter(i => i.status === 'fertig').length} von ${items.length} Paketen erledigt)` : '',
    '',
    sec('Erledigt in den letzten 14 Tagen', done, 'nichts abgeschlossen'),
    '', sec('Als Nächstes (nächste 14 Tage)', next, 'nichts terminiert'),
    '', sec('Verzögert oder blockiert', late, 'nichts'),
    '', sec('Wichtigste Risiken', topR, 'keine größeren Risiken'),
    '', sec('Offene Entscheidungen', openD, 'keine'),
    ...(qual.length ? ['', sec('Qualität & Machbarkeit', qual, '')] : [])
  ].filter((x, i, a) => !(x === '' && a[i - 1] === '')).join('\n');
  const f = el('div', 'form');
  if (!plans.length) f.append(el('p', 'muted', 'Tipp: Mit einem Reiter „Projektplan" (und „Risiken", „Entscheidungen") wird der Bericht deutlich aussagekräftiger.'));
  const al = el('label', '', 'Ampel'); const as = el('select'); Object.entries(AMP).forEach(([k, l]) => { const o = el('option', '', l); o.value = k; if (amp === k) o.selected = true; as.append(o); }); al.append(as); f.append(al);
  const out = el('textarea', 'aiout'); out.value = build(); f.append(out);
  as.addEventListener('change', () => { amp = as.value; out.value = build(); });
  const name = slug('Statusbericht ' + (pg.title || '') + ' ' + T);
  const acts = [
    { label: 'Kopieren', ghost: true, act: () => { copyRich(out.value).then(ok => { if (!ok) { out.select(); toast('Markiert – mit Strg+C kopieren'); } }); return false; } },
    { label: 'Als Word', ghost: true, act: () => { textDocx('Statusbericht ' + (pg.title || ''), out.value, name); return false; } },
    { label: 'Als Unterseite speichern', ghost: true, act: () => { const np = newPage({ title: 'Statusbericht ' + fmtShort(T), icon: '📊', parent: pg.id, mode: 'doc', blocks: linesToBlocks(out.value.split('\n').filter(l => l.trim())) }); closeModal(); renderSidebar(); openPage(np.id); return true; } }
  ];
  openModal('Statusbericht', f, acts);
}

const STUDY_TYPES = ['Randomisierte kontrollierte Studie (RCT)', 'Nicht-randomisierte Interventionsstudie', 'Kohortenstudie (prospektiv)', 'Kohortenstudie (retrospektiv)', 'Fall-Kontroll-Studie', 'Querschnittsstudie', 'Befragung / Umfrage', 'Qualitative Studie (Interviews, Fokusgruppen)', 'Mixed Methods', 'Pilot- / Machbarkeitsstudie', 'Diagnostische Studie', 'Registerstudie', 'Sonstiges'];
const Z_A = { '0.1': 1.645, '0.05': 1.96, '0.01': 2.576 }, Z_B = { '0.8': 0.8416, '0.9': 1.2816, '0.95': 1.6449 };
function studyN(n) {
  if (!n) return null;
  const za = Z_A[n.alpha || '0.05'], zb = Z_B[n.power || '0.8'], g = Math.max(1, +n.groups || 2), drop = clamp((+n.dropout || 0) / 100, 0, 0.9);
  let per = null;
  if (n.method === 'means') { const d = +n.delta, sd = +n.sd; if (d > 0 && sd > 0) per = 2 * Math.pow(za + zb, 2) * sd * sd / (d * d); }
  else if (n.method === 'props') { const p1 = (+n.p1) / 100, p2 = (+n.p2) / 100; if (p1 > 0 && p1 < 1 && p2 > 0 && p2 < 1 && p1 !== p2) { const pb = (p1 + p2) / 2; per = Math.pow(za * Math.sqrt(2 * pb * (1 - pb)) + zb * Math.sqrt(p1 * (1 - p1) + p2 * (1 - p2)), 2) / Math.pow(p1 - p2, 2); } }
  else if (n.method === 'manual') { const m = +n.manual; if (m > 0) return { per: null, total: Math.ceil(m / (1 - drop)), raw: m, g }; }
  if (!per) return null;
  per = Math.ceil(per); const raw = per * g;
  return { per, total: Math.ceil(raw / (1 - drop)), raw, g, perAdj: Math.ceil(per / (1 - drop)) };
}

/* ---------- Version history ---------- */
const VER = { col: null, last: lsGet('startklar.vlast', {}), hash: {} };

  if (Store.mode === 'db' && VER.col) VER.col.doc(pid + '_' + now).set({ page: pid, ts: now, title: pg.title || '', snap }).then(() => pruneVersions(pid)).catch(() => {});
  else { const all = lsGet('startklar.versions', {}); all[pid] = [{ ts: now, title: pg.title || '', snap }].concat(all[pid] || []).slice(0, 8); try { localStorage.setItem('startklar.versions', JSON.stringify(all)); } catch {} }
}

}

}

    else if (b.t === 'code') write(t, { mono: true, size: 9.5, indent: 4, before: 1, after: 3, color: [40, 50, 70] });
    else if (b.t === 'table') (b.rows || []).forEach((r, ri) => write(r.join('  |  '), { bold: ri === 0 && b.head !== false, size: 10 }));
    else if (b.t === 'divider') { if (y > 280) { doc.addPage(); y = 22; } doc.setDrawColor(200); doc.line(L, y, L + W, y); y += 5; }
    else if (b.t === 'file') write('Anhang: ' + b.name, { color: [91, 104, 120] });
    else if (b.t === 'link') write((b.text && b.text !== b.url ? b.text + ' – ' : '') + b.url, { color: [47, 91, 234] });
    else write(t || ' ', { after: 2, indent: b.level ? ind - 6 : 0 });
  });
  await saveDownload(slug(pg.title) + '.pdf', doc.output('blob'));
}
async function exportTasksCsv() {
  const q = s => '"' + String(s || '').replace(/"/g, '""').replace(/\n/g, ' ') + '"';
  const rows = [['Aufgabe', 'Seite', 'Fällig', 'Erledigt'].map(q).join(';')];
  allTodos().forEach(({ p, b }) => rows.push([b.text, p.title || 'Ohne Titel', b.due ? parse(b.due).toLocaleDateString('de-DE') : '', b.checked ? 'ja' : 'nein'].map(q).join(';')));
  await saveDownload('aufgaben-' + today() + '.csv', '\uFEFF' + rows.join('\r\n'));
}
async function blobToB64(blob) { const d = await readAsDataURL(blob); return d.split(',')[1] || ''; }
function usedAssets() {
  const m = {};
  const add = x => { if (x && x.asset) m[x.asset] = { name: x.name, mime: x.mime, wrapped: !!x.wrapped }; };
  Object.values(pages).concat(Object.values(trash)).forEach(p => {
    containers(p).forEach(c => { c.blocks.forEach(add); c.board.items.forEach(add); });
    (p.tabs || []).concat(p.trashTabs || []).forEach(t => (t.items || []).forEach(i => add(i.file)));
  });
  return m;
}
async function exportBackup(withFiles) {
  const data = { app: 'startklar', version: 4, exported: new Date().toISOString(), pages, trash, stores };
  if (withFiles) {
    const used = usedAssets(), ids = Object.keys(used); data.files = {};
    let n = 0, fail = 0;
    for (const id of ids) {
      toast(`Dateien werden eingepackt … ${++n}/${ids.length}`);
      try { const blob = await getFileBlob({ asset: id, mime: used[id].mime, wrapped: used[id].wrapped }); data.files[id] = { name: used[id].name, mime: used[id].mime || blob.type, b64: await blobToB64(blob) }; } catch { fail++; }
    }
    if (fail) toast(fail + ' Datei(en) konnten nicht eingepackt werden.');
  }
  const ok = await saveDownload('startklar-sicherung-' + today() + (withFiles ? '-mit-dateien' : '') + '.json', JSON.stringify(data));
  if (ok) toast(withFiles ? 'Sicherung inklusive Dateien gespeichert.' : 'Sicherung gespeichert (ohne Dateien).');
}
function importBackup() {
  const i = $('#jsonpick'); i.value = '';
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const ps = data && data.app === 'startklar' && data.pages;
      if (!ps || typeof ps !== 'object') throw 0;
      const list = Object.values(ps).filter(p => p && p.id && Array.isArray(p.blocks) && p.board);
      if (!list.length) throw 0;
      const nf = data.files ? Object.keys(data.files).length : 0;
      const box = el('div', 'form'); box.append(el('p', '', `${list.length} Seiten${nf ? ' und ' + nf + ' Dateien' : ''} aus der Sicherung vom ${new Date(data.exported).toLocaleDateString('de-DE')} einspielen? Seiten, die es schon gibt, werden mit dem Stand aus der Sicherung überschrieben.`));
      const cl = el('label', 'chkrow'); const cb = el('input'); cb.type = 'checkbox'; cl.append(cb, el('span', '', 'Alle aktuellen Seiten vorher in den Papierkorb legen (z. B. die Beispielseiten einer neuen Installation)')); box.append(cl);
      openModal('Sicherung einspielen', box, [
        { label: 'Abbrechen', ghost: true, act: () => {} },
        { label: 'Einspielen', act: () => { (async () => {
          if (cb.checked) { const keep = new Set(list.map(p => p.id)); kids(null).filter(p => !keep.has(p.id)).forEach(p => deletePage(p.id)); }
          const remap = {};
          if (nf) {
            if (!Cap.assets) toast('Dateien können hier nicht gespeichert werden – nur Seiten werden eingespielt.');
            else { let n = 0; for (const [id, x] of Object.entries(data.files)) { toast(`Dateien werden übernommen … ${++n}/${nf}`); try { const blob = decodeWrapped(x.b64, x.mime); const file = new File([blob], x.name || 'datei', { type: x.mime || blob.type }); const m = await uploadFile(file); remap[id] = { asset: m.asset, wrapped: m.wrapped }; } catch {} } }
          }
          const fix = o => { if (o && o.asset && remap[o.asset]) Object.assign(o, remap[o.asset]); };
          list.forEach(p => {
            containers(p).forEach(c => { (c.blocks || []).forEach(fix); ((c.board || {}).items || []).forEach(fix); });
            (p.tabs || []).forEach(t => (t.items || []).forEach(i => fix(i.file)));
            delete p.trashed; pages[p.id] = p; save(p.id);
          });
          if (data.stores) Object.keys(stores).forEach(k => { if (data.stores[k]) { stores[k] = data.stores[k]; saveStore(k); } });
          render(); toast(`${list.length} Seiten eingespielt`);
        })(); } }
      ], true);
    } catch { toast('Das ist keine gültige Startklar-Sicherung.'); }
  };
  i.click();
}
async function storageInfo() {
  let txt = 'Alle Daten liegen lokal in diesem Browser (IndexedDB) auf deinem Gerät.';
  try { const e = await navigator.storage.estimate(); txt += `\n\nBelegt: ${fmtSize(e.usage)} von ca. ${fmtSize(e.quota)}.`; } catch {}
  try { const p = await navigator.storage.persisted(); txt += p ? '\nDer Speicher ist als dauerhaft markiert und wird vom Browser nicht automatisch gelöscht.' : '\nHinweis: Der Browser könnte bei Speichermangel Daten löschen. Installiere die App oder erstelle regelmäßig Sicherungen.'; } catch {}
  txt += '\n\nTipp: Mach regelmäßig eine „Sicherung inkl. aller Dateien" (⋯-Menü unten links) – z. B. einmal pro Woche.';
  const pre = el('pre', 'verpre'); pre.textContent = txt;
  openModal('Speicherplatz & Daten', pre, [], true);
}
function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ---------- Global wiring ---------- */
$('#search').addEventListener('input', renderSidebar);
$('#newpage').addEventListener('click', e => newFromTemplate(e.currentTarget, null));
$('#scrim').addEventListener('click', () => $('#app').classList.remove('open'));
$('#footmenu').addEventListener('click', e => {
  const th = lsGet('startklar.theme', 'auto');
  showMenu(e.currentTarget, [
    { label: 'Sicherung herunterladen (nur Inhalte)', icon: '⤓', act: () => exportBackup(false) },
    { label: 'Sicherung inkl. aller Dateien', icon: '⤓', act: () => exportBackup(true) },
    { label: 'Sicherung einspielen', icon: '⤒', act: importBackup },
    { label: `Papierkorb (${trashCount()})`, icon: '🗑', act: () => openPage('v:trash') },
    ...(STANDALONE ? [{ label: 'Speicherplatz & Daten', icon: '💾', act: storageInfo }] : []),
    { sep: true }, { head: 'Darstellung' },
    ...[['auto', 'Wie das System'], ['light', 'Hell'], ['dark', 'Dunkel']].map(([k, l]) => ({ label: l, icon: th === k ? '✓' : '', act: () => { lsSet('startklar.theme', k); applyTheme(k); } }))
  ]);
});
NARROW.addEventListener('change', () => { if (cur) { renderHeader(); renderContent(); } });
applyTheme(lsGet('startklar.theme', 'auto'));

(async function boot() {
  pages = await Store.init();
  if (!Object.keys(pages).length && !Object.keys(trash).length) seed();
  stores.glossary.terms = stores.glossary.terms || []; stores.wins.items = stores.wins.items || []; stores.people.items = stores.people.items || [];
  purgeTrash();
  Object.values(pages).forEach(p => {
    if (!('tabs' in p) && p.status && p.status !== 'none') { p.tabs = stdTabs(p); save(p.id); }
    p.blocks = (p.blocks || []).filter(b => !b.busy);
    p.board = p.board || { items: [], edges: [], view: null };
    p.board.items = (p.board.items || []).filter(i => !i.busy); p.board.edges = p.board.edges || [];
    p.start = p.start || ''; p.end = p.end || '';
    p.tabs = (p.tabs || []).map(t => { if (t.kind === 'notes') { t.blocks = (t.blocks || []).filter(b => !b.busy); t.board = t.board || { items: [], edges: [], view: null }; t.board.items = (t.board.items || []).filter(i => !i.busy); t.board.edges = t.board.edges || []; } if (t.kind === 'library') t.items = (t.items || []).filter(i => !i.busy); if (['plan', 'risks', 'stakeholder', 'decisions'].includes(t.kind)) t.items = t.items || []; if (t.kind === 'db') { t.db = t.db || newDb('blank'); t.db.rows = t.db.rows || []; t.db.props = t.db.props || []; } return t; });
  });
  const last = lsGet('startklar.last', null);
  cur = last && (pages[last] || VIEWS[last]) ? last : 'v:home';
  setStatus('saved');
  $('#loading').remove();
  openPage(cur);
})();
})();
</script>
